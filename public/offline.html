<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101217" />
    <title>Spotnera offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
        background: #101217;
        color: #ffffff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(255, 122, 89, 0.28), transparent 28%),
          radial-gradient(circle at 80% 0%, rgba(51, 214, 166, 0.2), transparent 30%),
          linear-gradient(180deg, #191d24 0%, #101217 46%, #0c0d11 100%);
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.1);
        padding: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      p {
        margin: 0;
      }

      .brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.56);
      }

      h1 {
        margin: 12px 0 0;
        font-size: 30px;
        line-height: 1.1;
      }

      .copy {
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.68);
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Spotnera</p>
      <h1>You're offline.</h1>
      <p class="copy">Reconnect to discover live businesses and deals.</p>
    </main>
  </body>
</html>
